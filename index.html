<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sonic Aether</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sonic Aether: field recordings, experimental music as Aron Stadler, and sound for film by Daniel de Jong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,200..500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Home: one image, the header, and a small radio in the corner that receives a transmission. */
.hero { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--void); }
.hero img {
  position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover;
  filter: saturate(1.05) brightness(0.88);
}
.hero::after { /* scan lines + edges */
  content: ""; position: absolute; inset: 0; z-index: 2;
  background:
    repeating-linear-gradient(0deg, rgba(5,6,7,.22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(5,6,7,.55) 100%),
    linear-gradient(180deg, rgba(5,6,7,.5) 0%, transparent 16%, transparent 62%, rgba(5,6,7,.72) 100%);
}

/* wordmark: one word per column of light, set vertically, placed by script.
   The ink runs from dark (on the bright column top) to light (on pink and blue). */
.wordmark { position: fixed; inset: 0; margin: 0; pointer-events: none; z-index: 2; font-weight: inherit; }
.wordmark span {
  position: absolute; top: calc(22px + env(safe-area-inset-top, 0px)); left: 0;
  writing-mode: vertical-rl; transform: translateX(-50%);
  font-family: var(--f-text); font-weight: 300; font-variation-settings: "opsz" 72; line-height: 1; letter-spacing: -0.01em;
  color: #22123a; white-space: nowrap;
  opacity: 0; transition: opacity 1.2s ease;
}
body.placed .wordmark span { opacity: 1; }
.top .brand { visibility: hidden; }

/* header: each link sits inside a column of light (set by script);
   where the columns are too narrow it moves large to the bottom right */
.top nav ul { position: relative; }
body.pillars .top nav { position: fixed; inset: 0 0 auto 0; height: 0; z-index: 3; }
body.pillars .top nav li { position: absolute; top: calc(30px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); text-align: center; }
body.pillars .top nav a {
  display: block; color: #22123a; font-size: var(--nav-fs, 12px); font-weight: 500; letter-spacing: 0.2em; line-height: 1.55;
  transition: opacity .3s;
}
body.pillars .top nav ul:hover a { opacity: .55; }
body.pillars .top nav ul:hover li:hover a, body.pillars .top nav a:focus-visible { opacity: 1; color: #22123a; }
body.pillars .top nav a br { display: block; }
/* centre the words only: the trailing underscore and letter-spacing hang outside */
body.pillars .top nav a { padding-left: 0.2em; }
body.pillars .top nav a .us { display: inline-block; width: 0; overflow: visible; }
body.pillars .hero::after { background:
  repeating-linear-gradient(0deg, rgba(5,6,7,.18) 0 1px, transparent 1px 3px),
  radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(5,6,7,.5) 100%),
  linear-gradient(180deg, transparent 60%, rgba(5,6,7,.72) 100%); }
.top nav .hint {
  display: block; margin-top: 12px; font-family: var(--f-text); font-style: italic; font-size: 15px; line-height: 1.35;
  letter-spacing: 0; text-transform: none; color: #2c1846; pointer-events: none;
  opacity: 0; transform: translateY(-4px); transition: opacity .35s ease, transform .35s ease;
}
.top nav li:hover .hint, .top nav a:focus-visible + .hint { opacity: 1; transform: none; }
body:not(.pillars) .top nav .hint { display: none; }
body:not(.pillars) .top nav a br { display: none; }
body.navbottom .top nav { position: fixed; z-index: 3; right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
body.navbottom .top nav ul { flex-direction: column; align-items: flex-end; gap: 10px; max-width: none; }
body.navbottom .top nav a { color: var(--ink); font-size: 13px; letter-spacing: 0.2em; text-shadow: 0 0 18px rgba(5,6,7,.9), 0 0 4px rgba(5,6,7,.8); }

/* Aether Radio: a small antenna in the dark gap right of the wordmark column
   (placed by script); the label only speaks on hover. */
.radio {
  position: fixed; z-index: 3; left: max(34px, env(safe-area-inset-left, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.radio button { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.radio .v { display: grid; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 9px; letter-spacing: 0.34em; color: var(--dim); opacity: .55; white-space: nowrap; transition: opacity .5s, color .5s; }
.radio .v span { grid-area: 1 / 1; transition: opacity .5s; }
.radio .v .act { opacity: 0; }
.radio button:hover .v, .radio button:focus-visible .v { opacity: 1; color: var(--ink); }
.radio button:hover .v .rest, .radio button:focus-visible .v .rest { opacity: 0; }
.radio button:hover .v .act, .radio button:focus-visible .v .act { opacity: 1; }
.radio i { width: 15px; height: 15px; border: 1px solid rgba(169,219,232,.7); border-radius: 50%; position: relative; flex: none; transition: box-shadow .5s; }
.radio i::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--ice); opacity: 0; transition: opacity .5s; }
.radio button:hover i { box-shadow: 0 0 14px rgba(169,219,232,.4); }
.radio button[aria-pressed="true"] i::after { opacity: .9; animation: pulse 5s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
#wave { width: 26px; height: 0; display: block; opacity: 0; transition: opacity 1.4s ease, height 2s ease; }
.radio.on #wave { opacity: 1; height: 34vh; }
.bottom { display: flex; justify-content: flex-end; align-items: flex-end; }
.bottom .c { color: var(--faint); font-size: 10px; letter-spacing: 0.16em; }
@media (max-width: 720px) {
  .hero::after { background:
    repeating-linear-gradient(0deg, rgba(5,6,7,.2) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, transparent 55%, rgba(5,6,7,.78) 100%); } }
</style>
</head>
<body>
<div class="hero" aria-hidden="true">
  <img src="assets/home.jpg" alt="">
</div>
<div class="wrap">
  <header class="top">
    <div class="brand"><a href="index.html" aria-current="page">SONIC AETHER</a></div>
    <nav aria-label="Main">
      <ul>
        <li><a href="fieldrec.html">LISTENING<br> SHRINES<span class="us">_</span></a><span class="hint">Field recordings, resting in an imaginary terrain</span></li>
        <li><a href="aronstadler.html">ARON<br> STADLER<span class="us">_</span></a><span class="hint">Noise, tone, and the threshold between</span></li>
        <li><a href="sound.html">SOUND<br> FOR FILM<span class="us">_</span></a><span class="hint">Sound design for moving image</span></li>
        <li><a href="about.html">ABOUT<br> CONTACT<span class="us">_</span></a><span class="hint">Daniel de Jong</span></li>
      </ul>
    </nav>
  </header>

  <h1 class="wordmark"><span>Sonic</span><span>Aether</span></h1>
  <div></div>

  <div class="bottom">
    <section class="radio" id="radio" aria-label="Aether Radio">
      <canvas id="wave" aria-hidden="true"></canvas>
      <button id="listen" type="button" aria-pressed="false" aria-label="Start transmission">
        <span class="v" aria-hidden="true"><span class="rest">AETHER RADIO</span><span class="act" id="listen-label">START TRANSMISSION</span></span>
        <i aria-hidden="true"></i>
      </button>
    </section>
    <div class="c">Daniel Aron de Jong © 2026</div>
  </div>
</div>

<script>
/* Place each header link inside a column of light in the background image.
   Column centres are measured from the image pixels at the height of the links,
   using the image's real on-screen box (so scrollbars or browser chrome don't shift them). */
(() => {
  const items = [...document.querySelectorAll(".top nav li")];
  const hero = document.querySelector(".hero img");
  let cols = null; // [{c, w}] as fractions of image width, measured at row fraction `rowAt`
  let src = null, rowCache = {};
  function measure(fy) {
    const key = Math.round(fy * 200);
    if (rowCache[key]) return rowCache[key];
    const N = src.width, y = Math.max(0, Math.min(src.height - 1, Math.round(fy * src.height)));
    const d = src.getContext("2d").getImageData(0, Math.max(0, y - 6), N, 12).data;
    const row = new Float32Array(N);
    for (let x = 0; x < N; x++) { let v = 0; for (let k = 0; k < 12; k++) { const i = (k * N + x) * 4; v += d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11; } row[x] = v / 12; }
    const sm = new Float32Array(N), R = 6;           // smooth
    for (let x = 0; x < N; x++) { let a = 0, n = 0; for (let k = -R; k <= R; k++) { const j = x + k; if (j >= 0 && j < N) { a += row[j]; n++; } } sm[x] = a / n; }
    let lo = Infinity, mean = 0; for (const v of sm) { lo = Math.min(lo, v); mean += v; } mean /= N;
    const out = [], win = Math.round(N * 0.05);
    for (let x = 1; x < N - 1; x++) {
      let isMax = sm[x] > mean; for (let k = -win; k <= win && isMax; k++) { const j = x + k; if (j >= 0 && j < N && sm[j] > sm[x]) isMax = false; }
      if (!isMax) continue;
      const thr = (sm[x] + lo) / 2; let l = x, r = x;
      while (l > 0 && sm[l] > thr) l--; while (r < N - 1 && sm[r] > thr) r++;
      const c = (l + r) / 2 / N; if (!out.length || Math.abs(out[out.length - 1].c - c) > 0.03) out.push({ c, w: (r - l) / N });
    }
    return (rowCache[key] = out);
  }
  function layout() {
    if (!src) return;
    const r = hero.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    const D = Math.max(r.width, r.height), ox = r.left + (r.width - D) / 2, oy = r.top + (r.height - D) / 2;
    const labelY = (parseFloat(getComputedStyle(items[0]).top) || 30) + 18;
    const found = measure((labelY - oy) / D);
    const vis = found.map((o) => ({ x: ox + o.c * D, w: o.w * D })).filter((o) => o.x - o.w / 2 > 8 && o.x + o.w / 2 < vw - 8);
    const colPx = vis.length ? Math.min(...vis.map((o) => o.w)) : 0;
    window.__columns = vis; window.dispatchEvent(new CustomEvent("columns", { detail: vis }));
    // wordmark: the two left-most full columns, one word each, sized to the column
    const words = [...document.querySelectorAll(".wordmark span")];
    const top0 = parseFloat(getComputedStyle(words[0]).top) || 22, Hv = document.documentElement.clientHeight;
    const wide = vw >= 900 && colPx >= 100;
    if (vis.length >= (wide ? items.length + 2 : 2)) {
      // one word per column
      words.forEach((sp, i) => { const c = vis[i]; sp.style.left = c.x.toFixed(1) + "px"; sp.style.top = ""; sp.style.fontSize = (c.w * 0.86).toFixed(1) + "px"; });
    } else if (vis.length >= 1) {
      // both words stacked in the first column
      const c = vis[0];
      let fs = c.w * 0.86;
      words.forEach((sp) => { sp.style.left = c.x.toFixed(1) + "px"; sp.style.fontSize = fs + "px"; sp.style.top = ""; });
      const total = words[0].getBoundingClientRect().height + words[1].getBoundingClientRect().height + fs * 0.3;
      const room = Hv * 0.62;
      if (total > room) { fs *= room / total; words.forEach((sp) => (sp.style.fontSize = fs.toFixed(1) + "px")); }
      words[1].style.top = (top0 + words[0].getBoundingClientRect().height + fs * 0.3).toFixed(1) + "px";
    }
    if (vis.length) document.body.classList.add("placed");
    const ok = wide && vis.length >= items.length + 1;
    document.body.classList.toggle("pillars", ok);
    document.body.classList.toggle("navbottom", !ok);
    if (!ok) { items.forEach((li) => { li.style.left = ""; li.style.width = ""; }); return; }
    const use = vis.slice(-items.length);   // the right-most columns
    items.forEach((li, i) => { li.style.left = use[i].x.toFixed(1) + "px"; li.style.width = Math.round(use[i].w * 0.92) + "px"; });
    document.body.style.setProperty("--nav-fs", Math.max(12, Math.min(16, colPx / 13)).toFixed(1) + "px");
  }
  function init() {
    const N = 1000; src = document.createElement("canvas"); src.width = N; src.height = Math.round(N * hero.naturalHeight / hero.naturalWidth);
    src.getContext("2d", { willReadFrequently: true }).drawImage(hero, 0, 0, src.width, src.height);
    layout();
  }
  document.body.classList.add("navbottom");
  if (hero.complete && hero.naturalWidth) init(); else hero.addEventListener("load", init);
  addEventListener("resize", layout);
})();

/* Aether Radio — a generative transmission from somewhere else.
   Brown-noise carrier, standing waves from a just-intonation overtone row
   (detuned pairs beating left/right), overtones whistling out of the noise,
   and rare artefacts: glitches, distant pings with echo, static, drop-outs,
   and the whole carrier drifting as if the receiver were searching.
   Nothing repeats: every element is scheduled at random on the audio clock. */
(() => {
  const cv = document.getElementById("wave"), cx = cv.getContext("2d");
  const radio = document.getElementById("radio"), btn = document.getElementById("listen");
  const label = document.getElementById("listen-label");

  function createTransmission(ctx, destination) {
    const sr = ctx.sampleRate, rnd = Math.random, F0 = 54;   // carrier fundamental, Hz
    const LEVEL = 0.42;                                      // master level
    const G = (v = 1) => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const pan = (p) => { const n = ctx.createStereoPanner(); n.pan.value = p; return n; };

    const master = G(0), comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.08; comp.release.value = 0.6;
    const analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.85;
    master.connect(comp).connect(analyser).connect(destination);

    // a large, dark synthetic space
    const ir = ctx.createBuffer(2, Math.floor(sr * 7), sr);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c); let lp = 0;
      for (let i = 0; i < d.length; i++) { const t = i / sr; lp += 0.18 * ((rnd() * 2 - 1) - lp); d[i] = lp * Math.exp(-t / 1.9) * (t < 0.03 ? t / 0.03 : 1); }
    }
    const verb = ctx.createConvolver(); verb.buffer = ir;
    const dry = G(0.8), wet = G(0.75);
    dry.connect(master); verb.connect(wet).connect(master);
    const send = (node, d = 0.6, w = 0.4) => { node.connect(G(d)).connect(dry); node.connect(G(w)).connect(verb); };

    // shared noise buffers
    const brown = ctx.createBuffer(2, sr * 8, sr), white = ctx.createBuffer(1, sr * 2, sr);
    for (let c = 0; c < 2; c++) { const d = brown.getChannelData(c); let l = 0; for (let i = 0; i < d.length; i++) { l = (l + 0.02 * (rnd() * 2 - 1)) / 1.02; d[i] = l * 3.5; } }
    { const d = white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
    const lfo = (rate, depth, target, type = "sine") => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = rate;
      const g = G(depth); o.connect(g).connect(target); o.start(); return o;
    };
    const live = [];

    // 1 · carrier: brown noise that breathes
    const bed = ctx.createBufferSource(); bed.buffer = brown; bed.loop = true;
    const bedLp = ctx.createBiquadFilter(); bedLp.type = "lowpass"; bedLp.frequency.value = 340; bedLp.Q.value = 0.4;
    const bedG = G(0.36);
    bed.connect(bedLp).connect(bedG); send(bedG, 0.7, 0.35); bed.start();
    live.push(bed, lfo(0.008, 150, bedLp.frequency), lfo(0.005, 0.16, bedG.gain));

    // 2 · standing waves: overtone row, each partial a slowly beating L/R pair
    const ROW = [1, 1.5, 2, 3, 4, 5, 6, 7, 9, 11];
    const drones = [];
    ROW.forEach((n, i) => {
      const base = 0.075 / Math.pow(n, 0.8) * (n > 6 ? 0.55 : 1);
      const amp = G(base * 0.5);
      lfo(1 / (60 + rnd() * 140), base * 0.5, amp.gain);         // bloom and recede, 60–200 s
      const beat = 0.015 + rnd() * 0.09;                           // Hz between the pair: slow beating
      [-1, 1].forEach((side) => {
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = F0 * n + side * beat / 2;
        o.connect(pan(side * (0.25 + 0.5 * (i / ROW.length)))).connect(amp);
        o.start(); drones.push(o); live.push(o);
      });
      send(amp, 0.55, 0.5);
    });

    // 2b · sub bass: a slow sine an octave below the carrier, a fifth above it, and a rumble
    const sub = G(0.0);
    [[F0 / 2, 0.075], [F0 * 0.75, 0.025]].forEach(([f, a]) => {
      const o = ctx.createOscillator(); o.frequency.value = f; const g = G(a); o.connect(g).connect(sub); o.start(); live.push(o);
    });
    const rum = ctx.createBufferSource(); rum.buffer = brown; rum.loop = true; rum.loopStart = 5;
    const rumLp = ctx.createBiquadFilter(); rumLp.type = "lowpass"; rumLp.frequency.value = 70; rumLp.Q.value = 0.7;
    rum.connect(rumLp).connect(G(0.35)).connect(sub); rum.start(); live.push(rum);
    sub.gain.value = 0.75; lfo(1 / 140, 0.25, sub.gain);                  // swells over ~2½ min
    sub.connect(dry);

    // 3 · overtones singing out of the noise (very narrow band-passes that wander)
    const singers = [0, 1].map((k) => {
      const s = ctx.createBufferSource(); s.buffer = brown; s.loop = true; s.loopStart = k * 3;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 60; bp.frequency.value = F0 * (7 + k * 2);
      const g = G(0.75); s.connect(bp).connect(pan(k ? 0.6 : -0.6)).connect(g); send(g, 0.25, 0.8); s.start(); live.push(s);
      return bp;
    });

    // 3b · a faint, high ether hiss that comes and goes
    const air = ctx.createBufferSource(); air.buffer = white; air.loop = true;
    const airBp = ctx.createBiquadFilter(); airBp.type = "bandpass"; airBp.frequency.value = 7200; airBp.Q.value = 0.9;
    const airG = G(0.006); air.connect(airBp).connect(airG); send(airG, 0.3, 0.7); air.start();
    live.push(air, lfo(0.007, 0.005, airG.gain), lfo(0.012, 1800, airBp.frequency));

    // state for the readout
    const state = { drift: 0, event: "" };
    let nextAt = 0, timer = 0;

    // 4 · artefacts, scheduled on the audio clock
    const ARTEFACTS = {
      glitch(t) {
        const s = ctx.createBufferSource(); s.buffer = white;
        const hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 900 + rnd() * 2600; hp.Q.value = 2 + rnd() * 6;
        const g = G(0), d = 0.02 + rnd() * 0.07;
        s.connect(hp).connect(pan(rnd() * 2 - 1)).connect(g); send(g, 0.4, 0.6);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.004); g.gain.setValueAtTime(0.05, t + d); g.gain.linearRampToValueAtTime(0, t + d + 0.01);
        s.start(t, rnd(), d + 0.05);
        if (rnd() < 0.5) ARTEFACTS.glitchEcho(t + d + 0.04 + rnd() * 0.1);
      },
      glitchEcho(t) {
        const s = ctx.createBufferSource(); s.buffer = white; const g = G(0);
        const bp = ctx.createBiquadFilter(); bp.type = "highpass"; bp.frequency.value = 4000;
        s.connect(bp).connect(g); send(g, 0.2, 0.8);
        g.gain.setValueAtTime(0.018, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03); s.start(t, rnd(), 0.05);
      },
      ping(t) {
        const n = [12, 14, 15, 16, 18, 20, 21, 24][Math.floor(rnd() * 8)];
        const o = ctx.createOscillator(); o.frequency.value = F0 * n;
        const g = G(0), dl = ctx.createDelay(2), fb = G(0.45), lp = ctx.createBiquadFilter();
        lp.type = "lowpass"; lp.frequency.value = 1400; dl.delayTime.value = 0.6 + rnd() * 0.7;
        o.connect(g); g.connect(dl); dl.connect(lp).connect(fb).connect(dl);
        const out = G(1), p = pan(rnd() * 1.6 - 0.8); g.connect(out); lp.connect(out); out.connect(p); send(p, 0.3, 0.7);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.009, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
        o.start(t); o.stop(t + 2);
      },
      static(t) {
        const n = 6 + Math.floor(rnd() * 22), span = 0.3 + rnd() * 0.9;
        for (let i = 0; i < n; i++) {
          const tt = t + rnd() * span, s = ctx.createBufferSource(); s.buffer = white; const g = G(0);
          s.connect(pan(rnd() * 2 - 1)).connect(g); send(g, 0.5, 0.5);
          g.gain.setValueAtTime(0.05 + rnd() * 0.08, tt); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.002 + rnd() * 0.006);
          s.start(tt, rnd(), 0.012);
        }
      },
      dropout(t) {
        const g = master.gain, v = LEVEL, depth = 0.25 + rnd() * 0.3;
        g.setValueAtTime(v, t); g.linearRampToValueAtTime(v * depth, t + 0.05); g.setValueAtTime(v * depth, t + 0.3 + rnd() * 0.9); g.linearRampToValueAtTime(v, t + 2.5 + rnd() * 2);
      },
      drift(t) {
        const cents = (rnd() * 2 - 1) * (3 + rnd() * 9), dur = 45 + rnd() * 60;
        drones.forEach((o) => { o.detune.cancelScheduledValues(t); o.detune.setValueAtTime(o.detune.value, t); o.detune.linearRampToValueAtTime(cents, t + dur); });
        state.drift = cents;
      },
      wander(t) {
        singers.forEach((bp) => {
          const n = 6 + Math.floor(rnd() * 7); bp.frequency.cancelScheduledValues(t);
          bp.frequency.setValueAtTime(bp.frequency.value, t); bp.frequency.exponentialRampToValueAtTime(F0 * n, t + 45 + rnd() * 45);
        });
      },
    };
    const WEIGHTS = [["glitch", 3], ["ping", 2], ["static", 2], ["wander", 1], ["drift", 1], ["dropout", 1]];
    const pick = () => { let r = rnd() * WEIGHTS.reduce((a, w) => a + w[1], 0); for (const [k, w] of WEIGHTS) { if ((r -= w) <= 0) return k; } return "glitch"; };
    function schedule(until) {
      while (nextAt < until) {
        const k = pick(); ARTEFACTS[k](nextAt);
        const at = nextAt; setTimeout(() => (state.event = k), Math.max(0, (at - ctx.currentTime) * 1000));
        nextAt += 8 + rnd() * 18;
      }
    }

    return {
      analyser, state, F0,
      start() {
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(0, t); master.gain.linearRampToValueAtTime(LEVEL, t + 12);
        nextAt = t + 12 + rnd() * 6;
        schedule(t + 2); timer = setInterval(() => schedule(ctx.currentTime + 2), 1000);
      },
      stop() {
        clearInterval(timer);
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 5);
        setTimeout(() => { live.forEach((n) => { try { n.stop(); } catch (_) {} }); master.disconnect(); }, 5300);
      },
      // for offline rendering/tests
      scheduleOffline(until) { nextAt = 4; master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(LEVEL, 12); schedule(until); },
    };
  }
  window.createTransmission = createTransmission;

  let ctx = null, tx = null;
  const buf = new Uint8Array(2048);
  function frame() {
    if (tx) {
      const dpr = Math.min(devicePixelRatio || 1, 2), W = cv.clientWidth, Hc = cv.clientHeight;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(Hc * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(Hc * dpr); }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, Hc);
      cx.fillStyle = "rgba(226,230,232,0.12)"; cx.fillRect(W / 2, 0, 1, Hc);
      tx.analyser.getByteTimeDomainData(buf);
      cx.beginPath();
      for (let i = 0; i < buf.length; i += 4) { const y = Hc - Hc * i / buf.length, x = W / 2 + ((buf[i] - 128) / 128) * W * 2.2; i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      cx.strokeStyle = "rgba(226,230,232,0.7)"; cx.lineWidth = 1; cx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // sit in the dark gap between the first two full columns of light
  function place(vis) {
    if (!vis || vis.length < 2) { radio.style.left = ""; return; }
    const a = vis[0], b = vis[1];
    radio.style.left = (((a.x + a.w / 2) + (b.x - b.w / 2)) / 2).toFixed(1) + "px";
  }
  addEventListener("columns", (e) => place(e.detail));
  place(window.__columns);

  btn.addEventListener("click", () => {
    if (tx) {
      tx.stop(); tx = null;
      btn.setAttribute("aria-pressed", "false"); radio.classList.remove("on"); label.textContent = "START TRANSMISSION"; btn.setAttribute("aria-label", "Start transmission");
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext; ctx = ctx || new AC(); ctx.resume();
    tx = createTransmission(ctx, ctx.destination); tx.start();
    btn.setAttribute("aria-pressed", "true"); radio.classList.add("on"); label.textContent = "END TRANSMISSION"; btn.setAttribute("aria-label", "End transmission");
  });
})();

</script>
