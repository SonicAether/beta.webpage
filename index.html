<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sonic Aether</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sonic Aether: field recordings, experimental music as Aron Stadler, and sound for film by Daniel de Jong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,200..500&family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
/* Home: one image, the header, and a small radio in the corner. */
.hero { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--void); }
.hero img {
  position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover;
  filter: grayscale(1) contrast(1.18) brightness(0.6);
  animation: breathe 48s ease-in-out infinite alternate;
}
@keyframes breathe { from { transform: scale(1); } to { transform: scale(1.045); } }
.hero::before { /* cool tint */
  content: ""; position: absolute; inset: 0; z-index: 1;
  background: #5f8fa1; mix-blend-mode: color; opacity: .55;
}
.hero::after { /* scan lines + edges */
  content: ""; position: absolute; inset: 0; z-index: 2;
  background:
    repeating-linear-gradient(0deg, rgba(5,6,7,.38) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(5,6,7,.75) 100%),
    linear-gradient(180deg, rgba(5,6,7,.55) 0%, transparent 18%, transparent 70%, rgba(5,6,7,.7) 100%);
}

/* header descriptions on hover/focus */
.top nav li { position: relative; }
.top nav .hint {
  position: absolute; right: 0; top: calc(100% + 12px); width: max-content; max-width: 230px;
  font-family: var(--f-text); font-style: italic; font-size: 14px; line-height: 1.4; letter-spacing: 0; text-transform: none;
  color: var(--ink); text-align: right; pointer-events: none;
  opacity: 0; transform: translateY(-4px); transition: opacity .35s ease, transform .35s ease;
}
.top nav .hint::before { content: ""; display: block; width: 1px; height: 10px; background: var(--ice); margin: 0 0 8px auto; }
.top nav li:hover .hint, .top nav a:focus-visible + .hint { opacity: 1; transform: none; }

/* radio */
.radio { display: grid; gap: 14px; justify-items: start; width: min(360px, 100%); }
.radio button { display: inline-flex; align-items: center; gap: 14px; text-align: left; }
.radio i { width: 34px; height: 34px; border: 1px solid var(--ice); border-radius: 50%; position: relative; flex: none; transition: background .3s, box-shadow .3s; }
.radio i::before { content: ""; position: absolute; left: 13px; top: 10px; border-left: 10px solid var(--ice); border-top: 6.5px solid transparent; border-bottom: 6.5px solid transparent; }
.radio button[aria-pressed="true"] i::before { left: 11px; top: 11px; width: 3px; height: 11px; border: 0; background: var(--ice); box-shadow: 7px 0 0 var(--ice); }
.radio button:hover i { background: rgba(169,219,232,.1); box-shadow: 0 0 22px rgba(169,219,232,.25); }
.radio .t { display: grid; gap: 4px; }
.radio .t b { font-weight: 400; font-size: 10px; letter-spacing: 0.24em; }
.radio .t span { font-size: 10px; letter-spacing: 0.24em; color: var(--dim); }
.radio button[aria-pressed="true"] .t b { color: var(--ice); }
.scope { width: 100%; display: grid; gap: 6px; opacity: 0; transition: opacity .8s ease; }
.radio.on .scope { opacity: 1; }
#wave { width: 100%; height: 64px; display: block; }
.scope .meta { color: var(--dim); font-size: 10px; letter-spacing: 0.16em; font-variant-numeric: tabular-nums; }
.scope .meta span { color: var(--ink); }
.bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.bottom .c { color: var(--faint); font-size: 10px; letter-spacing: 0.16em; }
@media (max-width: 720px) { .top nav .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { .hero img { animation: none; } }
</style>
</head>
<body>
<div class="hero" aria-hidden="true">
  <img src="assets/home.jpg" alt="">
</div>
<div class="wrap">
  <header class="top">
    <h1 class="brand" style="margin:0;font-size:inherit;font-weight:inherit"><a href="index.html" aria-current="page">SONIC AETHER</a></h1>
    <nav aria-label="Main">
      <ul>
        <li><a href="fieldrec.html">LISTENING SHRINES_</a><span class="hint">Field recordings, resting in an imaginary terrain</span></li>
        <li><a href="aronstadler.html">ARON STADLER_</a><span class="hint">Noise, tone, and the threshold between</span></li>
        <li><a href="sound.html">SOUND FOR FILM_</a><span class="hint">Sound design for moving image</span></li>
        <li><a href="about.html">ABOUT CONTACT_</a><span class="hint">Daniel de Jong</span></li>
      </ul>
    </nav>
  </header>

  <div></div>

  <div class="bottom">
    <section class="radio" id="radio" aria-label="Aether Radio">
      <div class="scope" aria-hidden="true">
        <canvas id="wave"></canvas>
        <div class="meta">PROFILE N <span id="r-n">0000</span> · <span id="r-zone">fjäll</span> · WATER <span id="r-water">00</span> %</div>
      </div>
      <button id="listen" type="button" aria-pressed="false">
        <i aria-hidden="true"></i>
        <span class="t"><b>HEAR THE LAND</b><span>AETHER RADIO</span></span>
      </button>
    </section>
    <div class="c">Daniel de Jong © 2025</div>
  </div>
</div>

<script>
/* Aether Radio: a cross-section of the Listening Shrines terrain travels from
   the fjäll to the open sea. Its profile is the wavetable of a quiet drone;
   where the line crosses water, surf comes in. Drawn only while playing. */
(() => {
  const cv = document.getElementById("wave"), cx = cv.getContext("2d");
  const radio = document.getElementById("radio"), btn = document.getElementById("listen");
  const R = { n: document.getElementById("r-n"), zone: document.getElementById("r-zone"), water: document.getElementById("r-water") };
  const PERIOD = 150, SEA_TAIL = 0.1, S = 240;
  let NX = 0, NZ = 0, H, Wt, ready = false, t0 = performance.now();
  const prof = new Float32Array(S), wat = new Uint8Array(S);

  const img = new Image();
  img.onload = () => {
    NX = img.width; NZ = img.height;
    const c = document.createElement("canvas"); c.width = NX; c.height = NZ;
    const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(img, 0, 0);
    const px = g.getImageData(0, 0, NX, NZ).data;
    H = new Float32Array(NX * NZ); Wt = new Uint8Array(NX * NZ);
    for (let i = 0; i < NX * NZ; i++) { H[i] = (px[i*4+1] * 256 + px[i*4+2]) / 65535; Wt[i] = px[i*4] === 0 ? 1 : 0; }
    ready = true;
  };
  img.src = "assets/profile.png";

  function profile(f) {
    const land = 1 - SEA_TAIL;
    if (f >= land) { prof.fill(0); wat.fill(1); return; }
    const z = (f / land) * (NZ - 1), j0 = Math.floor(z), j1 = Math.min(j0 + 1, NZ - 1), fz = z - j0;
    for (let i = 0; i < S; i++) {
      const x = (i / (S - 1)) * (NX - 1), i0 = Math.floor(x), i1 = Math.min(i0 + 1, NX - 1), fx = x - i0;
      const a = H[j0*NX+i0]*(1-fx) + H[j0*NX+i1]*fx, b = H[j1*NX+i0]*(1-fx) + H[j1*NX+i1]*fx;
      prof[i] = a * (1 - fz) + b * fz;
      wat[i] = (Wt[j0*NX+Math.round(x)] + Wt[j1*NX+Math.round(x)]) > 0 ? 1 : 0;
    }
  }

  function frame(now) {
    if (sound.on && ready) {
      const t = (now - t0) / 1000, f = (t / PERIOD) % 1;
      profile(f);
      const dpr = Math.min(devicePixelRatio || 1, 2), W = cv.clientWidth, Hc = cv.clientHeight;
      if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(Hc * dpr); }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, W, Hc);
      const base = Hc - 6, amp = Hc - 12;
      cx.fillStyle = "rgba(226,230,232,0.15)"; cx.fillRect(0, base + 0.5, W, 1);
      cx.beginPath();
      for (let i = 0; i < S; i++) { const x = W * i / (S - 1), y = base - prof[i] * amp; i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
      cx.strokeStyle = "rgba(226,230,232,0.7)"; cx.lineWidth = 1; cx.stroke();
      let ws = 0;
      for (let i = 0; i < S; i++) if (wat[i]) {
        ws++; const glint = Math.pow(0.5 + 0.5 * Math.sin(t * 1.1 + i * 2.7), 6);
        cx.fillStyle = `rgba(169,219,232,${0.3 + glint * 0.6})`; cx.fillRect(W * i / (S - 1), base - 1 + Math.sin(t + i * .3), 1.4, 1.4);
      }
      R.n.textContent = String(Math.round((1 - f) * 3920) + 2000).padStart(4, "0");
      R.zone.textContent = f > 1 - SEA_TAIL ? "open sea" : f < 0.27 ? "fjäll" : f < 0.45 ? "forest hills" : f < 0.72 ? "moor & flats" : "coast";
      R.water.textContent = String(Math.round(ws / S * 100)).padStart(2, "0");
      sound.update(prof, ws / S);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const sound = (() => {
    let ctx, master, srcs = [], surf, last = 0, on = false;
    function wave(p) {
      const N = 48, M = p.length, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
      let mean = 0; for (let i = 0; i < M; i++) mean += p[i]; mean /= M;
      for (let k = 1; k <= N; k++) {
        let a = 0, b = 0;
        for (let i = 0; i < M; i++) { const ph = 2 * Math.PI * k * i / M, v = p[i] - mean; a += v * Math.cos(ph); b += v * Math.sin(ph); }
        re[k] = a / M; im[k] = b / M;
      }
      return ctx.createPeriodicWave(re, im);
    }
    function start() {
      const AC = window.AudioContext || window.webkitAudioContext; ctx = ctx || new AC(); ctx.resume();
      if (ready) profile(((performance.now() - t0) / 1000 / PERIOD) % 1);
      master = ctx.createGain(); master.gain.value = 0;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200; lp.Q.value = 0.3;
      lp.connect(master).connect(ctx.destination);
      [[55, -0.6, 0.5], [82.6, 0.6, 0.32], [110.3, 0, 0.18]].forEach(([fr, pn, gn]) => {
        const o = ctx.createOscillator(); o.frequency.value = fr; o.setPeriodicWave(wave(prof));
        const g = ctx.createGain(); g.gain.value = gn; const p = ctx.createStereoPanner(); p.pan.value = pn;
        o.connect(g).connect(p).connect(lp); o.start(); srcs.push(o);
      });
      const len = ctx.sampleRate * 3, buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); let l = 0; for (let i = 0; i < len; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; } }
      const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 700; bp.Q.value = 0.6;
      surf = ctx.createGain(); surf.gain.value = 0; n.connect(bp).connect(surf).connect(master); n.start(); srcs.push(n);
      master.gain.linearRampToValueAtTime(0.16, ctx.currentTime + 2.5);
      on = true;
    }
    function stop() {
      if (!on) return; on = false;
      const t = ctx.currentTime, old = srcs; srcs = [];
      master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 1.5);
      setTimeout(() => old.forEach((o) => { try { o.stop(); } catch (_) {} }), 1700);
    }
    function update(p, water) {
      const now = performance.now(); if (!on || now - last < 350) return; last = now;
      const w = wave(p); srcs.slice(0, 3).forEach((o) => o.setPeriodicWave(w));
      surf.gain.setTargetAtTime(water * 0.5, ctx.currentTime, 0.8);
    }
    return { start, stop, update, get on() { return on; } };
  })();

  btn.addEventListener("click", () => {
    const now = !sound.on;
    now ? sound.start() : sound.stop();
    btn.setAttribute("aria-pressed", String(now));
    radio.classList.toggle("on", now);
  });
})();
</script>
</body>
</html>
